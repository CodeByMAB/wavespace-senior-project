# Critical flow 4: app is mainnet-only; settings show fixed network (no switcher).
appId: com.anonymous.wavespace
---
- launchApp
- runFlow:
    when:
      visible: 'Settings'
    commands:
      - tapOn: 'Settings'
      - extendedWaitUntil:
          visible: 'Bitcoin mainnet'
          timeout: 15000
