# Critical flow 3: Send payment lifecycle (requires funded testnet wallet + Breez).
# Fails if the app is not wallet-ready (dashboard QuickActions or already on Send Payment).
appId: com.anonymous.wavespace
---
- launchApp
# Precondition: unlocked wallet — Withdraw is a QuickActions label on the dashboard, or Send Payment modal is already open.
- extendedWaitUntil:
    visible: '.*(Send Payment|Withdraw).*'
    timeout: 60000
- runFlow:
    when:
      notVisible: 'Send Payment'
    commands:
      - assertVisible: 'Withdraw'
      - tapOn: 'Send'
      - extendedWaitUntil:
          visible: 'Send Payment'
          timeout: 15000
- assertVisible: 'Send Payment'
- tapOn: 'Invoice, LNURL, or Lightning address'
- inputText: ''
- tapOn: '0'
- inputText: '100'
- tapOn: 'Review Payment'
- extendedWaitUntil:
    visible: 'Confirm Payment'
    timeout: 15000
- tapOn: 'Confirm & Send'
- extendedWaitUntil:
    visible: 'OK'
    timeout: 120000
# Post-condition: success alert from SendScreen (not a stray OK elsewhere).
- assertVisible: 'Payment Sent'
- assertVisible: 'Your Lightning payment was successful.'
- tapOn: 'OK'
# Post-condition: returned to dashboard with QuickActions.
- extendedWaitUntil:
    visible: 'Withdraw'
    timeout: 15000
- assertVisible: 'Withdraw'
